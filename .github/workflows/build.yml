name: Build SHAKTI AI Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate SHAKTI Wake Word
        run: |
          python3 -m pip install sherpa-onnx sentencepiece pypinyin
          MODEL="app/src/main/assets/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          echo "SHAKTI @SHAKTI" > "$MODEL/keywords_raw.txt"
          sherpa-onnx-cli text2token --tokens "$MODEL/tokens.txt" --tokens-type bpe --bpe-model "$MODEL/bpe.model" "$MODEL/keywords_raw.txt" "$MODEL/keywords.txt"
          cat "$MODEL/keywords.txt"

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAKTI-AI-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
