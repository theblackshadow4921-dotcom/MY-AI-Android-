name: Build MY AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYAI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > myai-release.jks
          test -s myai-release.jks

      - name: Build Signed Release APK
        run: gradle assembleRelease
        env:
          MYAI_KEYSTORE_PASSWORD: ${{ secrets.MYAI_KEYSTORE_PASSWORD }}
          MYAI_KEY_ALIAS: ${{ secrets.MYAI_KEY_ALIAS }}
          MYAI_KEY_PASSWORD: ${{ secrets.MYAI_KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-AI-SIGNED-APK
          path: app/build/outputs/apk/release/app-release.apk
